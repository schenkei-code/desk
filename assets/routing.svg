    <g transform="translate(64 434)"><rect width="250" height="80" rx="14" fill="#151b24" stroke="#2c3747"/><text x="24" y="36" font-size="20" fill="#e8edf3" font-weight="700">desk web</text><text x="24" y="60" font-size="14" fill="#7d8796">open · read · click</text></g>
    <path d="M314 474H392" stroke="#7cf5c4" stroke-width="2.5" marker-end="url(#g)"/>
