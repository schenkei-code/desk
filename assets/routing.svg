  </defs>
  <rect width="1280" height="560" rx="20" fill="#0d1117"/>
  <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="64" y="66" font-size="26" font-weight="700" fill="#e8edf3">How desk routes a command</text>
    <text x="64" y="96" font-size="17" fill="#7d8796">First driver that succeeds wins. If an action might already have landed, desk stops instead of retrying elsewhere.</text>
  </g>
