<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.04"/></pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.7"><stop offset="0.3" stop-color="#0a0a0a" stop-opacity="0"/><stop offset="1" stop-color="#0a0a0a" stop-opacity="1"/></radialGradient>
  </defs>
  <style>
    .in { animation: enter 400ms cubic-bezier(0.23, 1, 0.32, 1) both; }
    @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
    .d1 { animation-delay: 50ms; }.d2 { animation-delay: 100ms; }.d3 { animation-delay: 150ms; }.d4 { animation-delay: 200ms; }.d5 { animation-delay: 250ms; }.d6 { animation-delay: 300ms; }.d7 { animation-delay: 350ms; }.d8 { animation-delay: 400ms; }.d9 { animation-delay: 450ms; }
    .dot { opacity: 0; animation: travel 3.2s cubic-bezier(0.77, 0, 0.175, 1) 700ms infinite; }
    .dot1 { animation-delay: 1100ms; }
    @keyframes travel { 0% { opacity: 0; transform: translateX(0); } 6% { opacity: 1; }
      34% { opacity: 1; transform: translateX(var(--dx)); } 44%, 100% { opacity: 0; transform: translateX(var(--dx)); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
  <rect width="1280" height="560" rx="16" fill="#0a0a0a"/>
  <rect width="1280" height="560" rx="16" fill="url(#dots)"/>
  <rect width="1280" height="560" rx="16" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1279" height="559" rx="16" fill="none" stroke="#262626"/>
  <text x="64" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.6" fill="#ededed">How desk routes a command</text>
  <text x="64" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a1a1a1">The first driver that succeeds wins. If an action might already have landed, desk stops instead of retrying elsewhere.</text>
  <text class="in" x="64" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5c5c5c">DESKTOP APPS<tspan font-weight="400" letter-spacing="0" dx="10">macOS · Windows · Linux</tspan></text><line x1="304" y1="232.0" x2="360" y2="232.0" stroke="#ededed" stroke-width="1.5"/><line x1="610" y1="232.0" x2="666" y2="232.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 5"/><text x="638.0" y="222.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c">fallback</text><line x1="896" y1="232.0" x2="952" y2="232.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 5"/><g class="in d1"><g transform="translate(64 190)">
    <rect width="240" height="84" rx="12" fill="#141414" stroke="#262626" stroke-opacity="1" filter="url(#sh)"/>
    <text x="20" y="39.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#ededed">desk click</text>
    <text x="20" y="61.0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a1a1a1">find · type · shot · apps</text>
  </g></g><g class="in d2"><g transform="translate(360 190)">
    <rect width="250" height="84" rx="12" fill="#141414" stroke="#ededed" stroke-opacity="0.9" filter="url(#sh)"/><circle cx="232" cy="18" r="3.5" fill="#4ade80"/>
    <text x="20" y="39.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#ededed">agent-desktop</text>
    <text x="20" y="61.0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a1a1a1">semantic, headless</text>
  </g></g><g class="in d3"><g transform="translate(666 190)">
    <rect width="230" height="84" rx="12" fill="#141414" stroke="#262626" stroke-opacity="1" filter="url(#sh)"/>
    <text x="20" y="39.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#ededed">cua · AX</text>
    <text x="20" y="61.0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a1a1a1">accessibility token</text>
  </g></g><g class="in d4"><g transform="translate(952 190)">
    <rect width="264" height="84" rx="12" fill="#141414" stroke="#262626" stroke-opacity="1" filter="url(#sh)"/>
    <text x="20" y="39.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#ededed">cua · pixel</text>
    <text x="20" y="61.0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a1a1a1">click the element frame</text>
  </g></g><circle class="dot dot0" cx="304" cy="232.0" r="4" fill="#ededed" style="--dx:50px"/><text class="in" x="64" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5c5c5c">WEB<tspan font-weight="400" letter-spacing="0" dx="10">any OS</tspan></text><line x1="304" y1="442.0" x2="360" y2="442.0" stroke="#ededed" stroke-width="1.5"/><line x1="610" y1="442.0" x2="666" y2="442.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 5"/><text x="638.0" y="432.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c">fallback</text><line x1="896" y1="442.0" x2="952" y2="442.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 5"/><g class="in d5"><g transform="translate(64 400)">
    <rect width="240" height="84" rx="12" fill="#141414" stroke="#262626" stroke-opacity="1" filter="url(#sh)"/>
    <text x="20" y="39.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#ededed">desk web</text>
    <text x="20" y="61.0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a1a1a1">open · read · click · fill</text>
  </g></g><g class="in d6"><g transform="translate(360 400)">
    <rect width="250" height="84" rx="12" fill="#141414" stroke="#ededed" stroke-opacity="0.9" filter="url(#sh)"/><circle cx="232" cy="18" r="3.5" fill="#4ade80"/>
    <text x="20" y="39.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#ededed">agent-browser</text>
    <text x="20" y="61.0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a1a1a1">sticky session per page</text>
  </g></g><g class="in d7"><g transform="translate(666 400)">
    <rect width="230" height="84" rx="12" fill="#141414" stroke="#262626" stroke-opacity="1" filter="url(#sh)"/>
    <text x="20" y="39.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#ededed">agent-reach</text>
    <text x="20" y="61.0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a1a1a1">read-only content</text>
  </g></g><g class="in d8"><g transform="translate(952 400)">
    <rect width="264" height="84" rx="12" fill="#141414" stroke="#262626" stroke-opacity="1" filter="url(#sh)"/>
    <text x="20" y="39.0" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#ededed">playwright</text>
    <text x="20" y="61.0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a1a1a1">last resort</text>
  </g></g><circle class="dot dot1" cx="304" cy="442.0" r="4" fill="#ededed" style="--dx:50px"/><line x1="485.0" y1="274" x2="485.0" y2="304" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1.5"/><g class="in d9"><g transform="translate(367.0 304)">
    <rect width="236" height="30" rx="15" fill="#1f1808" stroke="#4a3a12"/>
    <text x="118" y="19.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#fbbf24">uncertain → stop and read state</text>
  </g></g>
</svg>